# Production Serving Configuration
# =================================

serving:
  host: "0.0.0.0"
  port: 8000
  workers: 1

  # API settings
  api_prefix: "/v1"
  enable_docs: false  # Disable in production
  cors_origins:
    - "https://your-domain.com"

  # Rate limiting
  rate_limit_requests: 100
  rate_limit_window_seconds: 60

  # Request handling
  request_timeout_seconds: 300
  max_concurrent_requests: 1000

  # Redis configuration
  redis:
    host: "redis"
    port: 6379
    db: 0
    password: null  # Set via environment variable NEXUS_REDIS__PASSWORD
    stream_name: "nexus:inference:requests"
    consumer_group: "nexus-workers"
    result_ttl_seconds: 3600

  # Inference configuration
  inference:
    backend: "vllm"
    model_name_or_path: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_model_len: 2048
    enable_prefix_caching: true
    enforce_eager: false

    # Generation defaults
    max_tokens: 256
    temperature: 0.7
    top_p: 0.95
    top_k: 50

    # Batching
    max_batch_size: 32
    batch_timeout_ms: 50

# Registry configuration
registry:
  storage_path: "/data/model_registry"
  metadata_backend: "local"

# Global settings
log_level: "INFO"
seed: 42
